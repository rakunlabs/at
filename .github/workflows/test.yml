on: [push]

name: Test
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27" # The Go version to download (if necessary) and use.
      # Prefetch modules with retries: proxy.golang.org occasionally drops an
      # HTTP/2 stream (INTERNAL_ERROR), which otherwise fails lint typecheck.
      - name: Download modules
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      # - name: download golangci.yml
      #   run: |
      #     [[ ! -f ".golangci.yml" ]] && curl -kfsSL -O https://raw.githubusercontent.com/worldline-go/guide/main/lint/.golangci.yml || true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m --new-from-rev=HEAD~1 --issues-exit-code=0
      - name: Run tests
        env:
          # Store-backed tests start a postgres container through
          # testcontainers; fail instead of skipping them if that is impossible.
          AT_TEST_POSTGRES_REQUIRED: "true"
        run: |
          golangci-lint run --timeout 10m --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.out ./...
          if ! go test -coverprofile=coverage.out -json ./... > test-report.out; then
            # The JSON report hides failures from the log; print the output
            # of every failed test and package.
            python3 - <<'EOF'
          import json, collections
          out, failed = collections.defaultdict(list), []
          for line in open("test-report.out"):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              key = (e.get("Package"), e.get("Test"))
              if e.get("Action") == "output":
                  out[key].append(e.get("Output", ""))
              elif e.get("Action") == "fail":
                  failed.append(key)
          for key in failed:
              print("::group::FAIL %s %s" % (key[0], key[1] or ""))
              print("".join(out[key]), end="")
              print("::endgroup::")
          EOF
            exit 1
          fi
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ env.REPOSITORY_NAME }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.out
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.out
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**,**/*_test.go
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
